name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python (jobs/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check jobs/ --fix

      - name: Run ruff formatter
        run: ruff format --check jobs/

  lint-typescript:
    name: Lint TypeScript (web/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

  general-checks:
    name: General file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          if grep -rI '[[:blank:]]$' --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "Found trailing whitespace"
            exit 1
          fi

      - name: Check YAML syntax
        run: |
          sudo apt-get install -y yamllint
          yamllint -d relaxed .github/workflows/

      - name: Check for large files
        run: |
          large_files=$(find . -type f -size +500k -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/.next/*")
          if [ -n "$large_files" ]; then
            echo "Found large files (>500kb):"
            echo "$large_files"
            exit 1
          fi
